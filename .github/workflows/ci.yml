name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ScoutingApp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ScoutingApp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # Public source releases intentionally exclude the model artifact.
          # Vite only needs a non-secret URL to validate the production build.
          VITE_ONDEVICE_MODEL_URL: https://example.invalid/frc_robot_detector_v2.onnx

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      # Pin lint behavior so a new Ruff release cannot turn unrelated style
      # rules into a red build without a reviewed migration.
      - run: pip install ruff==0.15.4 pytest pip-audit
      - run: pip-audit -r requirements.txt
      - run: ruff check app tests
      - run: PYTHONPATH=. pytest -q tests
