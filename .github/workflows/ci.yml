name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ScoutingApp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ScoutingApp/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The two static style guards; the others drive a browser against live data.
      - run: npm run guard:colours
      - run: npm run guard:type
      - run: npm run test
      - run: npm run build
        env:
          # Public source releases intentionally exclude the model artifact.
          # Vite only needs a non-secret URL to validate the production build.
          VITE_ONDEVICE_MODEL_URL: https://example.invalid/frc_robot_detector_v2.onnx

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/frc_test
      REDIS_URL: redis://localhost:6379/0
      RUN_MULTI_INSTANCE_REDIS_E2E: "1"
      RUN_POSTGRES_INTEGRATION_E2E: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      # CPU torch first: the default wheels pull the whole CUDA runtime.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "$(grep -E '^torch==' requirements.txt)"
      - run: pip install -r requirements.txt
      # Pin lint behavior so a new Ruff release cannot turn unrelated style
      # rules into a red build without a reviewed migration.
      - run: pip install ruff==0.15.4 pytest pip-audit
      # The detector label tools' tests need Pillow (requirements-training.txt).
      - run: pip install "$(grep -E '^pillow' requirements-training.txt)"
      # The optical-flow reference test needs OpenCV, which the server image no longer ships.
      - run: pip install "$(grep -E '^opencv' requirements-training.txt)"
      - run: pip-audit -r requirements.txt
      - run: ruff check app tests
      - run: alembic upgrade head
      # Fails when the models and the migrations disagree (a model change with no migration).
      - run: alembic check
      - run: PYTHONPATH=. pytest -q tests
