name: Deploy backend

# After CI passes on main, ships the backend to the VM when the merged commit touches
# backend/ or docker/. The SSH key can only run docker/ci-deploy.sh on the VM (a forced
# command), which builds, migrates, restarts and health-checks. The frontend deploys
# through Vercel on its own.
permissions:
  contents: read

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Backend changed?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Tests alone change nothing on the server; a restart would only cost the season replay.
          if git diff --name-only HEAD~1 HEAD | grep -E '^(backend/|docker/|\.dockerignore$)' | grep -qvE '^backend/tests/'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No backend changes in $(git rev-parse --short HEAD); nothing to deploy."
          fi
      - name: Deploy to the VM
        if: steps.changed.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          sha=$(git rev-parse HEAD)
          git archive "$sha" backend docker .dockerignore \
            | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
                ubuntu@141.148.171.128 "deploy $sha"
      - name: Live check
        if: steps.changed.outputs.deploy == 'true'
        run: |
          body=$(curl -fsS --max-time 60 --retry 3 --retry-delay 10 https://141-148-171-128.sslip.io/health/deep)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
