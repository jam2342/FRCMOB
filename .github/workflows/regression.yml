name: Regression

# Drives the app in a browser through the failures real users hit (lost reports,
# white screens, stuck pages): ScoutingApp/e2e/regression. Reads production's public
# data through a read-only proxy, so it runs nightly and on frontend changes rather
# than on every push.
permissions:
  contents: read

on:
  # Weekly for drift in live data; PRs that touch the frontend run it anyway.
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "ScoutingApp/src/**"
      - "ScoutingApp/public/sw.js"
      - "ScoutingApp/build/**"
      - "ScoutingApp/e2e/regression/**"
      - "ScoutingApp/vite.config.ts"
      - "ScoutingApp/vite.regression.config.ts"

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ScoutingApp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ScoutingApp/package-lock.json
      - run: npm ci
      # Chromium setup, split so an Ubuntu mirror or DNS blip can't blind this check
      # (one `install --with-deps` failed three runs in a row before any test ran).
      # The browser download is cached per Playwright version; apt is only touched if
      # the runner can't already launch Chromium, and then it is retried.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium (cached download, apt only if needed, retried)
        run: |
          retry() {
            local n=0 max=4
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then return 1; fi
              echo "::warning::'$*' failed (attempt $n of $max); retrying in $((n * 20))s"
              sleep $((n * 20))
            done
          }
          infra_fail() {
            echo "::error::$1. This is a CI infrastructure failure (package mirror or network), not a test result; no tests ran. Re-run the job."
            exit 1
          }
          canlaunch() {
            node -e "require('playwright').chromium.launch({ channel: 'chromium' }).then(b => b.close())" >/dev/null 2>&1
          }

          # Browser download: a cache hit makes this a no-op. No --with-deps, so no apt.
          retry npx playwright install chromium || infra_fail "Chromium download failed after 4 attempts"

          # System libraries: skip apt when the runner image already has them.
          if canlaunch; then
            echo "Chromium launches with the runner's own libraries; skipping apt."
          else
            echo "Chromium can't launch yet; installing its system dependencies."
            echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
            retry sudo apt-get update || echo "::warning::apt-get update kept failing; trying install-deps anyway"
            retry npx playwright install-deps chromium || infra_fail "apt could not install Chromium's system dependencies after 4 attempts"
            canlaunch || infra_fail "Chromium still won't launch after installing its dependencies"
          fi
      - run: npm run e2e:regression
        env:
          VITE_ONDEVICE_MODEL_URL: https://example.invalid/frc_robot_detector_v2.onnx
          # Full Chromium in the new headless mode: behaves like Chrome (service
          # worker offline, touch). The default headless shell differs there.
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: regression-failures
          path: ScoutingApp/e2e/regression/out/
          if-no-files-found: ignore
