version: 2
updates:
  - package-ecosystem: npm
    directory: /ScoutingApp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # numpy 2.5+ needs Python 3.12; the server image and CI run 3.11.
      # Drop this when the backend moves to 3.12.
      - dependency-name: numpy
        versions: [">=2.5"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
