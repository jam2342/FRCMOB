services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
    container_name: scouting-backend
    env_file:
      - ../.env
    environment:
      CLOUD_PROVIDER: ${CLOUD_PROVIDER:-oci}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      STRICT_STARTUP_ENV_VALIDATION: ${STRICT_STARTUP_ENV_VALIDATION:-true}
      ENFORCE_ADMIN_AUTH_FOR_WRITES: ${ENFORCE_ADMIN_AUTH_FOR_WRITES:-true}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?CORS_ALLOW_ORIGINS is required}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - backend_media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile.prod
    container_name: scouting-worker
    env_file:
      - ../.env
    environment:
      CLOUD_PROVIDER: ${CLOUD_PROVIDER:-oci}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      PYTHONPATH: /app
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - backend_media:/app/media

volumes:
  backend_media:
